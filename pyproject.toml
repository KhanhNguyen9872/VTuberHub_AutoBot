[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vtuberhub-autobot"
version = "2.0.0"
description = "Multi-user Telegram automation bot for VTuberHub"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "urllib3>=2.0",
    "python-socketio[client]>=5.10",
]

[project.scripts]
vtuberhub-autobot = "vtuberhub_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]
